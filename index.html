.wordmark{letter-spacing:.04em;font-size:15px;white-space:nowrap;font-weight:500;color:#fff}
.wordmark span{background:var(--grad-light);-webkit-background-clip:text;background-clip:text;color:transparent}
.collapse-btn{margin-left:auto;background:none;border:0;color:#8b8b95;cursor:pointer;padding:4px;border-radius:6px}
.collapse-btn:hover{background:rgba(255,255,255,.08)}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6e6e78;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#c9c9d1;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:#1f1f25;color:#fff}
.nav button.on{background:#26262e;color:#fff}
.nav button.on svg{color:var(--pri)}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px}
.venue{margin:10px;padding:12px;border-radius:12px;background:#1f1f25;border:1px solid #26262e;font-size:12px}
.venue b{color:#fff;display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.side-foot{display:flex;gap:6px;padding:0 10px 14px}
.side-foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#23232a;border:1px solid #33333c;color:#ddd;border-radius:9px;padding:8px;cursor:pointer;font-size:12.5px}
.side-foot button:hover{background:#2c2c34}
.app.collapsed .lbl,.app.collapsed .brand .wordmark,.app.collapsed .nav-sec,.app.collapsed .venue,.app.collapsed .cnt{display:none}
.app.collapsed .nav button{justify-content:center}
.app.collapsed .side-foot{flex-direction:column}
.app.collapsed .brand{flex-direction:column}
.app.collapsed .collapse-btn{margin:0;transform:rotate(180deg)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);min-height:62px}
.top h2{font-size:18px}
.datenav{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.datenav button{background:none;border:0;padding:6px 8px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.datenav button:hover{background:var(--card)}
.datenav .dlabel{padding:6px 10px;font-weight:600;min-width:118px;text-align:center;position:relative;cursor:pointer}
.datenav input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer}
.today-btn{font-size:12px;font-weight:600;color:var(--pri)!important}
.top .sp{flex:1}
.icon-btn{position:relative;background:none;border:1px solid transparent;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--bg);border-color:var(--line)}
.badge{position:absolute;top:3px;right:3px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#cfccc4;background:#fbfaf8}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{background:none;border-color:transparent;color:var(--pri)}
.btn.ghost:hover{background:var(--pri-l)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.content{flex:1;overflow:auto;padding:20px 22px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.mut{color:var(--mut)}
.small{font-size:12px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:550;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(20,20,30,.12)}
.seg button .n{font-size:11px;background:var(--greyl);border-radius:8px;padding:0 6px;color:var(--mut)}
.seg button.on .n{background:var(--pri-l);color:var(--pri)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--greyl);color:var(--mut);white-space:nowrap}
.chip.blue{background:var(--pri-l);color:var(--pri)}.chip.green{background:var(--okl);color:var(--ok)}.chip.amber{background:var(--warnl);color:var(--warn)}.chip.red{background:var(--badl);color:var(--bad)}.chip.purple{background:var(--purl);color:var(--pur)}
select.inp,input.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea.inp{min-height:76px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* table */
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:1}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--bg)}
table.t tr:last-child td{border-bottom:0}
.pname{font-weight:600}

VIEWS.dashboard=()=>{const[from,to]=rangeFor(U.dRange);const es=dashEntries(from,to);const ms=dashMembers();
 const worked=es.reduce((a,e)=>a+eDur(e),0),brk=es.reduce((a,e)=>a+eBreak(e),0);
 const ot=ms.reduce((a,m)=>a+splitOT(m.id,from,to).ot,0);const cost=ms.reduce((a,m)=>a+payFor(m.id,from,to),0);
 let chart;if(U.dRange==='day')chart=ms.map(m=>({label:m.name.split(' ')[0],value:hrs(es.filter(e=>e.member===m.id).reduce((a,e)=>a+eDur(e),0)),color:m.color}));
 else{chart=[];let d=from;while(d<=to){const v=hrs(es.filter(e=>tsYmd(e.in)===d).reduce((a,e)=>a+eDur(e),0));chart.push({label:U.dRange==='week'?fmtDate(d,{weekday:'short'}):String(+d.slice(8)),value:v,color:d===today()?'var(--pri)':'#8fa5e6'});d=addDays(d,1)}}
 const by=(key,look)=>{const m={};es.forEach(e=>{const k=e[key]||'';m[k]=(m[k]||0)+eDur(e)});return Object.entries(m).map(([k,v])=>{const o=look(k);return{label:o?o.name:'None',value:hrs(v),color:o?.color||'var(--grey)'}}).sort((a,b)=>b.value-a.value).slice(0,6)};
 const T=today(),soon=addDays(T,30);const ids=new Set(ms.map(m=>m.id));
 const up=[...S.timeoff.holidays.filter(h=>h.date>=T&&h.date<=soon).map(h=>({d:h.date,html:`<span class="chip purple">Holiday</span> <b>${esc(h.name)}</b>`})),...S.timeoff.requests.filter(r=>ids.has(r.member)&&r.status!=='rejected'&&r.end>=T&&r.start<=soon).map(r=>({d:r.start,html:`${avatar(mem(r.member),26)} <b>${esc(mem(r.member)?.name)}</b> <span class="mut">${esc(policy(r.policy)?.name)}${r.status==='pending'?' (pending)':''}</span>`}))].sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);
 return`${sub('dRange',[['day','Day'],['week','Week'],['month','Month']],scopeSeg('scope'))}

 const head=sub('tsTab',[['sheets','Timesheets'],['approvals','Approvals',(()=>{const n=activeMembers().filter(m=>!apOf(m.id,addDays(weekStartOf(today()),-7))&&entriesFor(m.id,addDays(weekStartOf(today()),-7),addDays(weekStartOf(today()),-1)).length).length;return n?` <span class="chip amber">${n}</span>`:''})()]],scopeSeg('scope'));
 const filt=`<div class="filters">${U.tsTab==='sheets'?seg('tsMode',[['week','Weekly'],['day','Daily']]):''}${nav}<select class="inp" data-act-change="setSel" data-k="tsGroup"><option value="">All groups</option>${opts(S.groups,U.tsGroup)}</select><select class="inp" data-act-change="setSel" data-k="tsSched"><option value="">All schedules</option>${opts(S.schedules,U.tsSched)}</select><div class="search">${ic('search',15)}<input class="inp" placeholder="Search members…" value="${esc(U.tsQ)}" data-act-input="tsQ"></div><div style="flex:1"></div>${U.tsTab==='sheets'?`<label class="row small" style="gap:6px;font-weight:600"><span class="toggle"><input type="checkbox" ${U.tsPayroll?'checked':''} data-act-change="tsPayroll"><span></span></span>Payroll hours</label><button class="btn" data-act="exportTS">${ic('download',16)} Export</button><button class="btn pri" data-act="newEntry">${ic('plus',16)} Add time entry</button>`:`<button class="btn pri" data-act="approveAll" data-ws="${weekStartOf(U.tsDate)}">${ic('check',16)} Approve all</button>`}</div>`;
 if(U.tsTab==='approvals'){const a=weekStartOf(U.tsDate),b=addDays(a,6);return head+filt+`<div class="card"><table class="t"><thead><tr><th>Member</th><th>Group</th><th>Tracked</th><th>Overtime</th><th>Entries</th><th>Status</th><th></th></tr></thead><tbody>${ms.map(m=>{const sp=splitOT(m.id,a,b);const n=entriesFor(m.id,a,b).length;const ap=apOf(m.id,a);return`<tr class="click" data-act="memberSheet" data-id="${m.id}" data-ws="${a}"><td><div class="row">${avatar(m,30)}<span class="pname">${esc(m.name)}</span></div></td><td class="mut">${esc(grp(m.group)?.name||'—')}</td><td><b>${HM(sp.total)}</b></td><td class="${sp.ot?'soon':'mut'}">${HM(sp.ot)}</td><td>${n}</td><td>${apChip(m.id,a)}${ap?`<div class="small mut">${esc(mem(ap.by)?.name||'')} · ${relTime(ap.at)}</div>`:''}</td><td><div class="act-row">${ap?`<button class="btn sm" data-act="approve" data-id="${m.id}" data-ws="${a}" data-s="reset">Undo</button>`:`<button class="btn sm danger" data-act="approve" data-id="${m.id}" data-ws="${a}" data-s="rejected">Reject</button><button class="btn sm pri" data-act="approve" data-id="${m.id}" data-ws="${a}" data-s="approved" ${n?'':'disabled'}>Approve</button>`}</div></td></tr>`}).join('')||`<tr><td colspan="7">${empty('people','No members match')}</td></tr>`}</tbody></table></div>`}
 if(U.tsMode==='day'){const d=U.tsDate;return head+filt+`<div class="card"><table class="t"><thead><tr><th>Member</th><th>First in</th><th>Last out</th><th>Breaks</th><th>Tracked</th><th>Activities</th><th>Status</th></tr></thead><tbody>${ms.map(m=>{const es=entriesFor(m.id,d,d);const lv=leaveOn(m.id,d),hol=isHoliday(d,m.id);const fi=firstIn(m.id,d),lo=lastOut(m.id,d);return`<tr class="click" data-act="memberSheet" data-id="${m.id}" data-ws="${weekStartOf(d)}"><td><div class="row">${avatar(m,30)}<span class="pname">${esc(m.name)}</span></div></td><td>${fi?`<span class="${isLate(m.id,d)?'over':''}">${tsHM(fi)}</span>`:'—'}</td><td>${openEntry(m.id)&&tsYmd(openEntry(m.id).in)===d?'<span class="okc">Working</span>':lo?tsHM(lo):'—'}</td><td>${es.length?HM(dayBreak(m.id,d)):'—'}</td><td><b>${es.length?HM(dayTotal(m.id,d)):'—'}</b></td><td>${[...new Set(es.map(e=>e.activity))].map(a=>`<span class="chip" style="background:${act(a)?.color}22;color:${act(a)?.color}">${esc(act(a)?.name||'')}</span>`).join(' ')}</td><td>${lv?`<span class="chip blue">${esc(policy(lv.policy)?.name)}</span>`:hol?`<span class="chip purple">${esc(hol.name)}</span>`:`<span class="chip" style="color:${ST_COLOR[status(m.id)]}">${ST_LABEL[status(m.id)]}</span>`}</td></tr>`}).join('')}</tbody></table></div>`}
 const days=[...Array(7)].map((_,i)=>addDays(ws,i));
 return head+filt+`<div class="card"><table class="t tsgrid"><thead><tr><th>Member</th>${days.map(d=>`<th class="h ${d===today()?'today':''}">${fmtDate(d,{weekday:'short'})}<div style="font-weight:500;text-transform:none;letter-spacing:0">${+d.slice(8)}</div></th>`).join('')}<th class="h">Total</th>${U.tsPayroll?'<th class="h">Regular</th><th class="h">Overtime</th><th class="h">Gross pay</th>':''}<th>Approval</th></tr></thead><tbody>${ms.map(m=>{const sp=splitOT(m.id,ws,we);return`<tr class="click" data-act="memberSheet" data-id="${m.id}" data-ws="${ws}"><td><div class="row" style="flex-wrap:nowrap">${avatar(m,30)}<span class="pname">${esc(m.name)}</span></div></td>${days.map(d=>{const t=dayTotal(m.id,d);const lv=leaveOn(m.id,d),hol=isHoliday(d,m.id);return`<td class="h ${d===today()?'today':''} ${t?'':'zero'} ${t>dailyOTms(m)?'ot':''}">${t?HM(t):lv?`<span class="chip blue" title="${esc(policy(lv.policy)?.name)}">${esc((policy(lv.policy)?.name||'').split(' ')[0])}</span>`:hol?`<span class="chip purple" title="${esc(hol.name)}">Hol</span>`:!workday(m,d)?'<span class="chip rest">Rest day</span>':'-'}</td>`}).join('')}<td class="h"><b>${HM(sp.total)}</b></td>${U.tsPayroll?`<td class="h">${HM(sp.reg)}</td><td class="h ${sp.ot?'ot':'zero'}">${HM(sp.ot)}</td><td class="h">${money(payFor(m.id,ws,we))}</td>`:''}<td>${apChip(m.id,ws)}</td></tr>`}).join('')||`<tr><td colspan="12">${empty('people','No members match')}</td></tr>`}</tbody>
 <tfoot><tr><td style="padding:12px 14px"><b>Total</b></td>${days.map(d=>`<td class="h"><b>${HM(ms.reduce((a,m)=>a+dayTotal(m.id,d),0))}</b></td>`).join('')}<td class="h"><b>${HM(ms.reduce((a,m)=>a+splitOT(m.id,ws,we).total,0))}</b></td>${U.tsPayroll?`<td class="h">${HM(ms.reduce((a,m)=>a+splitOT(m.id,ws,we).reg,0))}</td><td class="h">${HM(ms.reduce((a,m)=>a+splitOT(m.id,ws,we).ot,0))}</td><td class="h"><b>${money(ms.reduce((a,m)=>a+payFor(m.id,ws,we),0))}</b></td>`:''}<td></td></tr></tfoot></table></div>`};

let MAP=null,MAPPINS={};
function loadLeaflet(cb){if(window.L)return cb(true);const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';let done=false;s.onload=()=>{done=true;cb(true)};s.onerror=()=>{done=true;cb(false)};setTimeout(()=>{if(!done){done=true;cb(false)}},6000);document.head.appendChild(s)}

 const pts=ms.map(m=>{const e=openEntry(m.id)||S.entries.filter(x=>x.member===m.id&&x.lat!=null).slice(-1)[0];return e&&e.lat!=null?{m,e}:null}).filter(Boolean);
 loadLeaflet(ok=>{if(!$('#map'))return;MAPPINS={};
  if(!ok){const all=[...pts.map(p=>[p.e.lat,p.e.lng]),...S.locations.map(l=>[l.lat,l.lng])];const la=all.map(a=>a[0]),ln=all.map(a=>a[1]);const[a0,a1,b0,b1]=[Math.min(...la),Math.max(...la),Math.min(...ln),Math.max(...ln)];const X=v=>8+(v-b0)/((b1-b0)||1)*84,Y=v=>10+(a1-v)/((a1-a0)||1)*82;
   el.outerHTML=`<div class="mapfallback">${S.locations.map(l=>`<div class="pin" style="left:${X(l.lng)}%;top:${Y(l.lat)}%;color:var(--mut)">${ic('pin',22)}<div>${esc(l.name)}</div></div>`).join('')}${pts.map(p=>`<div class="pin" style="left:${X(p.e.lng)}%;top:${Y(p.e.lat)}%">${avatar(p.m,30)}</div>`).join('')}<div class="small mut" style="position:absolute;bottom:8px;left:12px">Map tiles couldn't load — showing relative positions</div></div>`;return}
  if(MAP){MAP.remove();MAP=null}MAP=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(MAP);
  S.locations.forEach(l=>L.circle([l.lat,l.lng],{radius:+l.radius||150,color:'#4a6cd0',weight:1,fillOpacity:.08}).addTo(MAP).bindTooltip(esc(l.name)));
  const b=[];pts.forEach(({m,e})=>{const icon=L.divIcon({className:'',html:`<div class="av" style="width:32px;height:32px;font-size:11.5px;background:${m.color};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${esc(initials(m.name))}<i style="background:${ST_COLOR[status(m.id)]}"></i></div>`,iconSize:[32,32],iconAnchor:[16,16]});MAPPINS[m.id]=L.marker([e.lat,e.lng],{icon}).addTo(MAP).bindPopup(`<b>${esc(m.name)}</b><br>${ST_LABEL[status(m.id)]}<br>${esc(locn(e.location)?.name||'')} · ${tsHM(e.out||e.in)}`);b.push([e.lat,e.lng])});

function repRange(){return U.rRange==='custom'?[U.rFrom,U.rTo]:rangeFor(U.rRange)}
function repEntries(){const[f,t]=repRange();return S.entries.filter(e=>tsYmd(e.in)>=f&&tsYmd(e.in)<=t&&(!U.rMember||e.member===U.rMember)&&(!U.rProject||e.project===U.rProject)&&!mem(e.member)?.archived)}
const GROUPS={member:['Member',e=>e.member,mem],activity:['Activity',e=>e.activity,act],project:['Project',e=>e.project,proj],client:['Client',e=>proj(e.project)?.client||'',client],location:['Location',e=>e.location,locn],day:['Date',e=>tsYmd(e.in),k=>({name:fmtDate(k,{weekday:'short',day:'numeric',month:'short'})})],group:['Group',e=>mem(e.member)?.group,grp]};
function trackedRows(){const g=GROUPS[U.rGroup];const m={};repEntries().forEach(e=>{const k=g[1](e)||'';const r=m[k]||(m[k]={k,ms:0,bill:0,billMs:0,cost:0,n:0});const d=eDur(e);r.ms+=d;r.n++;const b=billFor(e);r.bill+=b;if(b)r.billMs+=d;r.cost+=hrs(d)*(+mem(e.member)?.rate||0)});
 return Object.values(m).map(r=>{const o=g[2](r.k);return{...r,label:o?o.name:'None',color:o?.color}}).sort((a,b)=>U.rGroup==='day'?a.k.localeCompare(b.k):b.ms-a.ms)}
VIEWS.reports=()=>{const head=sub('rTab',[['tracked','Tracked Time Report'],['attendance','Attendance Insights'],['exports','Exported Files']]);
 if(U.rTab==='exports')return head+`<div class="card"><table class="t"><thead><tr><th>File</th><th>Exported</th><th>By</th><th></th></tr></thead><tbody>${S.exports.map((x,i)=>`<tr><td>${ic('file',16)} <b>${esc(x.name)}</b></td><td>${new Date(x.at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}</td><td>${esc(mem(x.by)?.name||'')}</td><td><div class="act-row"><button class="btn sm" data-act="redownload" data-i="${i}">${ic('download',14)} Download</button></div></td></tr>`).join('')||`<tr><td colspan="4">${empty('file','No exported files yet','Exports from timesheets and reports appear here.')}</td></tr>`}</tbody></table></div>`;
 const[f,t]=repRange();const rangeCtl=`${seg('rRange',[['week','This week'],['lastweek','Last week'],['month','This month'],['lastmonth','Last month'],['custom','Custom']])}${U.rRange==='custom'?`<input type="date" class="inp" value="${U.rFrom}" data-act-change="rDate" data-k="rFrom"><span class="mut">to</span><input type="date" class="inp" value="${U.rTo}" data-act-change="rDate" data-k="rTo">`:`<span class="mut small">${fmtDate(f)} – ${fmtDate(t)}</span>`}`;
 if(U.rTab==='attendance'){const rows=activeMembers().map(m=>attRow(m,f,t));return head+`<div class="filters">${rangeCtl}<div style="flex:1"></div><button class="btn" data-act="exportAtt">${ic('download',16)} Export</button></div>
  <div class="stats"><div class="card stat"><div class="k">Days worked</div><div class="v">${rows.reduce((a,r)=>a+r.days,0)}</div></div><div class="card stat"><div class="k">Late arrivals</div><div class="v" style="color:var(--warn)">${rows.reduce((a,r)=>a+r.late,0)}</div></div><div class="card stat"><div class="k">Absences</div><div class="v" style="color:var(--bad)">${rows.reduce((a,r)=>a+r.absent,0)}</div></div><div class="card stat"><div class="k">Overtime</div><div class="v">${HM(rows.reduce((a,r)=>a+r.ot,0))}</div></div></div>
  <div class="card"><table class="t"><thead><tr><th>Member</th><th>Days worked</th><th>Avg clock-in</th><th>Avg clock-out</th><th>Avg hours/day</th><th>Late</th><th>Absent</th><th>Time off</th><th>Overtime</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="row">${avatar(r.m,30)}<span class="pname">${esc(r.m.name)}</span></div></td><td>${r.days}</td><td>${r.avgIn||'—'}</td><td>${r.avgOut||'—'}</td><td>${r.days?HM(r.total/r.days):'—'}</td><td class="${r.late?'soon':''}">${r.late}</td><td class="${r.absent?'over':''}">${r.absent}</td><td>${r.leave}</td><td>${HM(r.ot)}</td></tr>`).join('')}</tbody></table></div>`}
 const rows=trackedRows();const tot=rows.reduce((a,r)=>a+r.ms,0),bill=rows.reduce((a,r)=>a+r.bill,0),billMs=rows.reduce((a,r)=>a+r.billMs,0),cost=rows.reduce((a,r)=>a+r.cost,0);
 return head+`<div class="filters">${rangeCtl}</div><div class="filters"><span class="small mut" style="font-weight:600">Group by</span><select class="inp" data-act-change="setSel" data-k="rGroup">${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}" ${U.rGroup===k?'selected':''}>${v[0]}</option>`).join('')}</select><select class="inp" data-act-change="setSel" data-k="rMember"><option value="">All members</option>${opts(activeMembers(),U.rMember)}</select><select class="inp" data-act-change="setSel" data-k="rProject"><option value="">All projects</option>${opts(S.projects,U.rProject)}</select><div style="flex:1"></div><button class="btn" data-act="exportTracked">${ic('download',16)} Export CSV</button></div>
 <div class="stats"><div class="card stat"><div class="k">Tracked</div><div class="v">${HM(tot)}</div></div><div class="card stat"><div class="k">Billable hours</div><div class="v">${HM(billMs)}</div></div><div class="card stat"><div class="k">Billable amount</div><div class="v">${money(bill)}</div></div><div class="card stat"><div class="k">Labour cost</div><div class="v">${money(cost)}</div></div></div>
 <div class="card pad" style="margin-bottom:14px">${rows.length?bars(rows.slice(0,U.rGroup==='day'?31:12).map(r=>({label:r.label,value:hrs(r.ms),color:r.color})),{h:220,fmt:v=>v+'h'}):empty('chart','No tracked time in this range')}</div>
 <div class="card"><table class="t"><thead><tr><th>${GROUPS[U.rGroup][0]}</th><th>Entries</th><th>Tracked</th><th>Share</th><th>Billable hours</th><th>Billable amount</th><th>Labour cost</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="swatch" style="background:${r.color||'var(--grey)'}"></span><b>${esc(r.label)}</b></td><td>${r.n}</td><td><b>${HM(r.ms)}</b></td><td>${tot?Math.round(r.ms/tot*100):0}%</td><td>${HM(r.billMs)}</td><td>${money(r.bill)}</td><td>${money(r.cost)}</td></tr>`).join('')}</tbody></table></div>`};
function attRow(m,f,t){let d=f,days=0,late=0,absent=0,leave=0,ins=[],outs=[],total=0;const end=t<today()?t:today();
 while(d<=end){const es=entriesFor(m.id,d,d);if(es.length){days++;total+=dayTotal(m.id,d);if(isLate(m.id,d))late++;const fi=firstIn(m.id,d),lo=lastOut(m.id,d);ins.push(new Date(fi).getHours()*60+new Date(fi).getMinutes());if(lo)outs.push(new Date(lo).getHours()*60+new Date(lo).getMinutes())}else if(workday(m,d)&&!isHoliday(d,m.id)){if(leaveOn(m.id,d))leave++;else if(d<today())absent++}d=addDays(d,1)}
 const avg=a=>a.length?fromMin(a.reduce((x,y)=>x+y,0)/a.length):'';return{m,days,late,absent,leave,total,avgIn:avg(ins),avgOut:avg(outs),ot:splitOT(m.id,f,t).ot}}

VIEWS.tracking=()=>{const P='settings.policies';const head=sub('ttTab',[['policies','Policies'],['approvals','Approvals'],['rounding','Time Rounding']]);
 if(U.ttTab==='approvals'){const A='settings.approvals';return head+`<div class="card pad" style="max-width:820px">${tog(A+'.enabled','Enable timesheet approvals','Managers review and approve tracked time for each period.')}<div class="setrow"><div><b>Approval period</b><div class="d">How often timesheets are submitted for approval.</div></div><select class="inp" data-bind="${A}.period"><option value="weekly" ${S.settings.approvals.period==='weekly'?'selected':''}>Weekly</option><option value="biweekly" ${S.settings.approvals.period==='biweekly'?'selected':''}>Every 2 weeks</option><option value="monthly" ${S.settings.approvals.period==='monthly'?'selected':''}>Monthly</option></select></div>${tog(A+'.lock','Lock approved timesheets','Members cannot edit time entries once their timesheet is approved.')}${tog(A+'.autoRemind','Remind approvers','Send a reminder when a period ends with timesheets still pending.')}</div>`}
 if(U.ttTab==='rounding'){const R='settings.rounding';const sel=(k,v)=>`<select class="inp" data-bind="${R}.${k}" data-rerender="1">${[['none','No rounding'],['up','Round up'],['down','Round down'],['nearest','Round to nearest']].map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${b}</option>`).join('')}</select>`;const stp=(k,v)=>`<select class="inp" data-bind="${R}.${k}" data-rerender="1">${[1,5,6,10,15,30].map(n=>`<option value="${n}" ${+v===n?'selected':''}>${n} minutes</option>`).join('')}</select>`;const r=S.settings.rounding;
  return head+`<div class="card pad" style="max-width:820px"><p class="mut" style="margin-top:0">Rounding changes how clock-in and clock-out times count in timesheets and reports. The original times are always kept.</p><div class="setrow"><div><b>Clock-in</b><div class="d">e.g. 08:53 → ${tsHM(roundTs(atHM(today(),'08:53'),r.inMode,+r.inStep))}</div></div><div class="row">${sel('inMode',r.inMode)}${stp('inStep',r.inStep)}</div></div><div class="setrow"><div><b>Clock-out</b><div class="d">e.g. 17:38 → ${tsHM(roundTs(atHM(today(),'17:38'),r.outMode,+r.outStep))}</div></div><div class="row">${sel('outMode',r.outMode)}${stp('outStep',r.outStep)}</div></div><div class="setrow"><div><b>Late arrival grace period</b><div class="d">Minutes after the scheduled start before a clock-in counts as late.</div></div><input class="inp" type="number" min="0" value="${S.settings.graceMins}" data-bind="settings.graceMins" style="max-width:110px"></div><div class="setrow"><div><b>Overtime pay multiplier</b><div class="d">Applied to overtime hours in payroll figures.</div></div><input class="inp" type="number" min="1" step="0.1" value="${S.settings.otMultiplier}" data-bind="settings.otMultiplier" style="max-width:110px"></div></div>`}
 return head+`<div class="card pad" style="max-width:820px"><p class="mut" style="margin-top:0">These time tracking rules apply to everyone in the organization.</p>
 ${secT('Device restrictions')}${tog(P+'.mobile','Mobile apps')}${tog(P+'.kiosk','Shared kiosk')}${tog(P+'.web','Web browser')}${tog(P+'.desktop','Desktop apps')}${tog(P+'.offline','Allow members to clock in and out on mobile while offline')}
 ${secT('Verification')}${tog(P+'.face','Require verification by face recognition','After the PIN on the kiosk (and when people clock themselves in on the web), the camera checks their face against the photo saved in People.')}${tog(P+'.selfie','Require selfies when clocking in and out','Takes a photo at clock in and clock out. Photos show on timesheets and are kept for 90 days.')}${S.settings.policies.face?`<div class="small" style="margin:-4px 0 8px;color:var(--warn)">${activeMembers().filter(m=>!m.face).length} member(s) still need a face photo — add them in People.</div>`:''}
 ${secT('Location')}${tog(P+'.liveLoc','Enable live location tracking','',"PRO")}${tog(P+'.reqLoc','Require location with time entries')}${tog(P+'.geofence','Enable geofencing','Members can only clock in within a location\'s radius.')}${tog(P+'.autoIn','Automatically clock in on entry')}${tog(P+'.autoOut','Automatically clock out on exit')}
 ${secT('Time entries')}${tog(P+'.reqActivity','Require activity when clocking in')}${tog(P+'.reqProject','Require project when clocking in')}${tog(P+'.memberEdit','Allow members to edit their time entries')}${tog(P+'.memberEditLoc','Allow members to edit location of their time entries')}
 ${secT('Work schedule restrictions')}${tog(P+'.restrictSchedule','Restrict clock in/out to the work schedule')}<div class="setrow"><div><b>Allow early clock in up to</b></div><div class="row"><input class="inp" type="number" min="0" value="${S.settings.policies.earlyIn}" data-bind="${P}.earlyIn" style="max-width:90px"><span class="mut">minutes</span></div></div><div class="setrow"><div><b>Allow late clock out up to</b></div><div class="row"><input class="inp" type="number" min="0" value="${S.settings.policies.lateOut}" data-bind="${P}.lateOut" style="max-width:90px"><span class="mut">minutes</span></div></div></div>`};
VIEWS.schedules=()=>`<div class="row between" style="margin-bottom:14px"><p class="mut" style="margin:0">Fixed or flexible work hours, breaks and overtime rules for your team.</p><button class="btn pri" data-act="editSchedule">${ic('plus',16)} Add new schedule</button></div>
 <div class="cards">${S.schedules.map(sc=>{const n=S.members.filter(m=>m.schedule===sc.id&&!m.archived).length;const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return`<div class="card navcard" data-act="editSchedule" data-id="${sc.id}"><div class="row between"><div class="ic">${ic('cal',20)}</div>${sc.isDefault?'<span class="chip blue">Default</span>':''}</div><b style="font-size:15px">${esc(sc.name)}</b><div class="small mut">${sc.type==='fixed'?'Fixed':'Flexible'} · ${[1,2,3,4,5,6,0].filter(d=>sc.days[d]).map(d=>dn[d]).join(', ')||'No working days'}</div><div class="small">${sc.type==='fixed'?Object.values(sc.days)[0]?.join(' – ')||'':`${sc.flexHours}h per day`}${sc.breakMins?` · ${sc.breakMins} min break`:''}</div><div class="small mut">Overtime after ${sc.dailyOT}h/day${sc.weeklyOT?` or ${sc.weeklyOT}h/week`:''} · ${n} member${n!==1?'s':''}</div></div>`}).join('')||empty('cal','No schedules added yet')}</div>`;
VIEWS.timeoffset=()=>{const head=sub('tosTab',[['policies','Time Off Policies'],['holidays','Holidays']],U.tosTab==='policies'?`<button class="btn pri" data-act="addPolicy">${ic('plus',16)} Add policy</button>`:`<button class="btn" data-act="importHolidays">${ic('download',16)} Import UK bank holidays</button><button class="btn pri" data-act="addHoliday">${ic('plus',16)} Add manually</button>`);
 if(U.tosTab==='holidays'){const hs=[...S.timeoff.holidays].sort((a,b)=>a.date.localeCompare(b.date));return head+`<div class="card"><table class="t"><thead><tr><th>Date</th><th>Holiday</th><th></th></tr></thead><tbody>${hs.map(h=>{const i=S.timeoff.holidays.indexOf(h);return`<tr style="${h.date<today()?'opacity:.55':''}"><td style="width:200px"><input type="date" class="inp" value="${h.date}" data-bind="timeoff.holidays.${i}.date" data-rerender="1"></td><td><input class="inp" value="${esc(h.name)}" data-bind="timeoff.holidays.${i}.name"></td><td><div class="act-row"><button class="btn sm danger" data-act="delHoliday" data-id="${h.id}">${ic('trash',14)}</button></div></td></tr>`}).join('')||`<tr><td colspan="3">${empty('sun','No holidays added')}</td></tr>`}</tbody></table></div>`}
 return head+`<div class="card"><table class="t"><thead><tr><th>Colour</th><th>Policy</th><th>Paid</th><th>Yearly allowance (days)</th><th></th></tr></thead><tbody>${S.timeoff.policies.map((p,i)=>`<tr><td style="width:70px"><input type="color" value="${p.color}" data-bind="timeoff.policies.${i}.color" data-rerender="1" style="width:38px;height:30px;border:0;background:none"></td><td><input class="inp" value="${esc(p.name)}" data-bind="timeoff.policies.${i}.name"></td><td><label class="toggle"><input type="checkbox" ${p.paid?'checked':''} data-bind="timeoff.policies.${i}.paid"><span></span></label></td><td style="width:200px"><input class="inp" type="number" min="0" value="${p.allowance}" data-bind="timeoff.policies.${i}.allowance"></td><td><div class="act-row"><button class="btn sm danger" data-act="delPolicy" data-id="${p.id}">${ic('trash',14)}</button></div></td></tr>`).join('')}</tbody></table></div><p class="small mut">Set the allowance to 0 for unlimited policies.</p>`};
VIEWS.locations=()=>`<div class="row between" style="margin-bottom:14px"><p class="mut" style="margin:0">Places where your team clocks in and out. Used for geofencing and the live map.</p><button class="btn pri" data-act="editLocation">${ic('plus',16)} Add location</button></div>
 <div class="card"><table class="t"><thead><tr><th>Name</th><th>Address</th><th>Coordinates</th><th>Radius</th><th>Entries (30 days)</th></tr></thead><tbody>${S.locations.map(l=>`<tr class="click" data-act="editLocation" data-id="${l.id}"><td><b>${esc(l.name)}</b></td><td>${esc(l.address)}</td><td class="mut small">${(+l.lat).toFixed(4)}, ${(+l.lng).toFixed(4)}</td><td>${l.radius} m</td><td>${S.entries.filter(e=>e.location===l.id&&tsYmd(e.in)>=addDays(today(),-30)).length}</td></tr>`).join('')||`<tr><td colspan="5">${empty('pin','No locations yet')}</td></tr>`}</tbody></table></div>`;
VIEWS.projects=()=>{const head=sub('apTab',[['activities','Activities'],['projects','Projects'],['clients','Clients']],`<button class="btn pri" data-act="addAP">${ic('plus',16)} Add ${U.apTab==='activities'?'Activity':U.apTab==='projects'?'Project':'Client'}</button>`);
 if(U.apTab==='activities')return head+`<div class="card"><table class="t"><thead><tr><th>Colour</th><th>Activity</th><th>Billable</th><th>Tracked (30 days)</th><th></th></tr></thead><tbody>${S.activities.map((a,i)=>`<tr><td style="width:70px"><input type="color" value="${a.color}" data-bind="activities.${i}.color" data-rerender="1" style="width:38px;height:30px;border:0;background:none"></td><td><input class="inp" value="${esc(a.name)}" data-bind="activities.${i}.name" data-setup="activities"></td><td><label class="toggle"><input type="checkbox" ${a.billable!==false?'checked':''} data-bind="activities.${i}.billable"><span></span></label></td><td>${HM(S.entries.filter(e=>e.activity===a.id&&tsYmd(e.in)>=addDays(today(),-30)).reduce((x,e)=>x+eDur(e),0))}</td><td><div class="act-row"><button class="btn sm danger" data-act="delAP" data-k="activities" data-id="${a.id}">${ic('trash',14)}</button></div></td></tr>`).join('')}</tbody></table></div>`;
 if(U.apTab==='clients')return head+`<div class="card"><table class="t"><thead><tr><th>Client</th><th>Email</th><th>Billing address</th><th>Projects</th><th></th></tr></thead><tbody>${S.clients.map((c,i)=>`<tr><td><input class="inp" value="${esc(c.name)}" data-bind="clients.${i}.name"></td><td><input class="inp" value="${esc(c.email)}" data-bind="clients.${i}.email"></td><td><textarea class="inp" style="min-height:54px" data-bind="clients.${i}.address">${esc(c.address)}</textarea></td><td>${S.projects.filter(p=>p.client===c.id).length}</td><td><div class="act-row"><button class="btn sm danger" data-act="delAP" data-k="clients" data-id="${c.id}">${ic('trash',14)}</button></div></td></tr>`).join('')}</tbody></table></div>`;
 return head+`<div class="card"><table class="t"><thead><tr><th>Colour</th><th>Project</th><th>Code</th><th>Client</th><th>Bill rate /h</th><th>Tracked (30 days)</th><th></th></tr></thead><tbody>${S.projects.map((p,i)=>`<tr style="${p.archived?'opacity:.5':''}"><td style="width:70px"><input type="color" value="${p.color}" data-bind="projects.${i}.color" data-rerender="1" style="width:38px;height:30px;border:0;background:none"></td><td><input class="inp" value="${esc(p.name)}" data-bind="projects.${i}.name" data-setup="activities"></td><td style="width:110px"><input class="inp" value="${esc(p.code)}" data-bind="projects.${i}.code"></td><td><select class="inp" data-bind="projects.${i}.client">${opts(S.clients,p.client,{none:'No client (non-billable)'})}</select></td><td style="width:120px"><input class="inp" type="number" min="0" value="${p.billRate}" data-bind="projects.${i}.billRate"></td><td>${HM(S.entries.filter(e=>e.project===p.id&&tsYmd(e.in)>=addDays(today(),-30)).reduce((x,e)=>x+eDur(e),0))}</td><td><div class="act-row"><button class="btn sm" data-act="archProject" data-id="${p.id}" title="${p.archived?'Restore':'Archive'}">${ic('archive',14)}</button><button class="btn sm danger" data-act="delAP" data-k="projects" data-id="${p.id}">${ic('trash',14)}</button></div></td></tr>`).join('')}</tbody></table></div><p class="small mut">If a project has no bill rate, the member's bill rate is used for invoices and reports.</p>`};
VIEWS.organization=()=>{const o=S.org;return`<div class="grid2" style="align-items:start;max-width:1100px"><div class="card pad"><b style="font-size:15px">Organization details</b>
 <label class="f">Organization name</label><input class="inp" value="${esc(o.name)}" data-bind="org.name" data-rerender="1"><label class="f">Address (used as sender address on invoices)</label><textarea class="inp" data-bind="org.address">${esc(o.address)}</textarea>
 <div class="grid2"><div><label class="f">Billing email</label><input class="inp" value="${esc(o.email)}" data-bind="org.email"></div><div><label class="f">VAT number</label><input class="inp" value="${esc(o.vat)}" data-bind="org.vat"></div></div>
 <div class="grid2"><div><label class="f">Currency</label><select class="inp" data-bind="org.currency" data-rerender="1">${['GBP','EUR','USD','AUD','CAD','TRY','AED'].map(c=>`<option ${o.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="f">Week starts on</label><select class="inp" data-bind="org.weekStart" data-rerender="1"><option value="1" ${+o.weekStart===1?'selected':''}>Monday</option><option value="0" ${+o.weekStart===0?'selected':''}>Sunday</option></select></div></div>
 <label class="f">Company logo</label>${o.logo?`<div class="row"><img src="${o.logo}" alt="Logo" style="max-height:56px;max-width:180px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff"><button class="btn sm danger" data-act="clearLogo">Remove</button></div>`:`<div class="drop">${ic('upload',18)}<div><b style="color:var(--pri)">Upload image</b> or drop it here</div><div class="small">PNG, JPEG or JPG. Size limit: 2 MB</div><input type="file" accept="image/png,image/jpeg" data-act-change="orgLogo"></div>`}</div>
 <div><div class="card pad" style="margin-bottom:14px"><b style="font-size:15px">You</b><div class="setrow"><div><b>Signed in as</b><div class="d">Switch to preview what each role sees.</div></div><select class="inp" data-act-change="switchMe">${opts(activeMembers(),S.me)}</select></div>${tog('settings.dark','Dark mode')}</div>
 <div class="card pad"><b style="font-size:15px">Data</b><p class="small mut">Everything is stored in this browser. Export a backup to move it to another device.</p><div class="row"><button class="btn" data-act="backup">${ic('download',16)} Export backup</button><label class="btn" style="position:relative">${ic('upload',16)} Restore backup<input type="file" accept="application/json" data-act-change="restore" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label><button class="btn danger" data-act="resetDemo">${ic('trash',16)} Reset demo data</button></div></div></div></div>`};
</script>
<script>
/* ================= drawers & modals ================= */
let D=null;
function openDrawer(title,body,foot=''){$('#drawer').innerHTML=`<div class="dr-head"><h3>${title}</h3><button class="icon-btn" data-act="closeDrawer" title="Close">${ic('x')}</button></div><div class="dr-body">${body}</div>${foot?`<div class="dr-foot">${foot}</div>`:''}`;$('#drawer').classList.add('open');$('#scrim').classList.add('show')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('show');D=null}
function openModal(html,w=620){const m=$('#modal');m.innerHTML=`<div class="modal card" style="max-width:${w}px">${html}</div>`;m.classList.add('show')}
function ask(msg,yes,label='Delete'){openModal(`<div class="pad"><b style="font-size:16px">Are you sure?</b><p class="mut">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" id="askYes" style="background:var(--bad)">${label}</button></div></div>`,420);$('#askYes').onclick=()=>{A.closeModal();yes()}}
const fld=(label,html)=>`<label class="f">${label}</label>${html}`;
const drIn=(k,v,type='text',extra='')=>`<input class="inp" type="${type}" value="${esc(v??'')}" data-dr="${k}" ${extra}>`;
const drSel=(k,list,v,o)=>`<select class="inp" data-dr="${k}">${opts(list,v,o)}</select>`;

const A={};
A.focusPin=el=>{const p=MAPPINS[el.dataset.id];if(p&&MAP){MAP.setView(p.getLatLng(),15);p.openPopup()}else toast('No location for this member yet')};
A.go=el=>{U.view=el.dataset.v;closeDrawer();A.closeModal();render();$('#content').scrollTop=0};
A.set=el=>{U[el.dataset.k]=el.dataset.v;render()};
A.setSel=el=>{U[el.dataset.k]=el.value;render()};
A.toggle=el=>{U[el.dataset.k]=!U[el.dataset.k];render()};
A.collapse=()=>$('#app').classList.toggle('collapsed');
A.closeDrawer=()=>closeDrawer();
A.closeModal=()=>{$('#modal').classList.remove('show');$('#modal').innerHTML='';if(IV)IV=null};
A.toggleDark=()=>{S.settings.dark=!S.settings.dark;save();render()};
A.dismissOnboarding=()=>{S.settings.onboardingDismissed=true;save();U.view='dashboard';render();toast('Onboarding hidden')};
A.notifs=()=>{openDrawer('Notifications',S.notes.length?S.notes.map(n=>`<div class="notif"><div class="ic">${ic(n.icon||'bell',16)}</div><div style="flex:1"><div style="${n.read?'':'font-weight:650'}">${esc(n.text)}</div><div class="small mut">${relTime(n.at)}</div></div></div>`).join(''):empty('bell','No notifications'),`<button class="btn" data-act="readAll">Mark all as read</button>`);S.notes.forEach(n=>n.read=true);save();renderTop()};
A.readAll=()=>{S.notes.forEach(n=>n.read=true);save();closeDrawer();render()};

/* ---- clock in / out ---- */
function clockDrawer(mid){const m=mem(mid);const P=S.settings.policies;const last=S.entries.filter(e=>e.member===mid).slice(-1)[0];
 D={kind:'clock',member:mid,activity:last?.activity||'',project:last?.project||'',location:last?.location||S.locations[0]?.id||'',note:'',geo:false};
 openDrawer('Clock in',`${isAdmin()?fld('Member',drSel('member',activeMembers().filter(x=>status(x.id)==='out'),mid)):`<div class="row" style="margin-top:14px">${avatar(m)}<b>${esc(m.name)}</b></div>`}
 ${fld('Activity'+(P.reqActivity?' *':''),drSel('activity',S.activities,D.activity,{none:'No activity'}))}${fld('Project'+(P.reqProject?' *':''),drSel('project',S.projects.filter(p=>!p.archived),D.project,{none:'No project'}))}
 ${fld('Location'+(P.reqLoc?' *':''),drSel('location',S.locations,D.location,{none:'No location'}))}<label class="row small" style="margin-top:8px;gap:8px"><input type="checkbox" data-dr="geo"> Attach my device's current GPS position</label>${fld('Note',`<textarea class="inp" data-dr="note" placeholder="What are you working on?"></textarea>`)}`,
 `<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn pri" data-act="doClockIn" style="background:var(--ok)">${ic('play',14)} Clock in</button>`)}
A.clockIn=(el)=>clockDrawer(el?.dataset?.id||S.me);
A.doClockIn=()=>{const P=S.settings.policies;if(P.reqActivity&&!D.activity)return toast('Choose an activity');if(P.reqProject&&!D.project)return toast('Choose a project');if(P.reqLoc&&!D.location)return toast('Choose a location');if(openEntry(D.member))return toast('Already clocked in');
 const l=locn(D.location);const e={id:uid(),member:D.member,in:Date.now(),out:null,brk:0,brkStart:null,activity:D.activity,project:D.project,location:D.location,lat:l?.lat??null,lng:l?.lng??null,note:D.note,manual:false,source:'web'};
 const done=async()=>{if(e.member===S.me){const r=await verifyForClock(e.member,'clock in');if(!r)return;stampPhoto(e,'In',r);e.in=Date.now()}if(openEntry(e.member))return toast('Already clocked in');S.entries.push(e);save();const n=mem(e.member).name;closeDrawer();render();toast(`${n.split(' ')[0]} clocked in at ${tsHM(e.in)}`)};
 if(D.geo&&navigator.geolocation){toast('Getting your location…');navigator.geolocation.getCurrentPosition(p=>{e.lat=p.coords.latitude;e.lng=p.coords.longitude;if(P.geofence&&l){const dist=geoDist(e.lat,e.lng,l.lat,l.lng);if(dist>(+l.radius||150))return toast(`You're ${Math.round(dist)} m from ${l.name} — outside the geofence`)}done()},()=>{toast('Location unavailable — clocked in without GPS');done()},{timeout:8000})}else done()};
function geoDist(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function doClockOut(mid){const e=openEntry(mid);if(!e)return;if(e.brkStart){e.brk=(e.brk||0)+Math.round((Date.now()-e.brkStart)/6e4);e.brkStart=null}e.out=Date.now();save();return e}
A.clockOut=async el=>{const mid=el?.dataset?.id||S.me;if(!openEntry(mid))return;let r=null;if(mid===S.me){r=await verifyForClock(mid,'clock out');if(!r)return}const e=doClockOut(mid);if(!e)return;stampPhoto(e,'Out',r);save();render();if(D&&D.kind==='sheet')memberSheet(D.mid,D.ws);toast(`${mem(mid).name.split(' ')[0]} clocked out · ${HM(dayTotal(mid,today()))} today`)};
A.startBreak=el=>{const e=openEntry(el?.dataset?.id||S.me);if(!e)return;e.brkStart=Date.now();save();render();toast('Break started')};
A.endBreak=el=>{const e=openEntry(el?.dataset?.id||S.me);if(!e||!e.brkStart)return;const m=Math.round((Date.now()-e.brkStart)/6e4);e.brk=(e.brk||0)+m;e.brkStart=null;save();render();toast(`Break ended · ${m} min`)};

/* ---- member timesheet drawer ---- */
function memberSheet(mid,ws){const m=mem(mid);if(!m)return;ws=ws||weekStartOf(U.tsDate);D={kind:'sheet',mid,ws};const we=addDays(ws,6);const sp=splitOT(mid,ws,we);const st=status(mid);const ap=apOf(mid,ws);
 let body=`<div class="row" style="margin:14px 0">${avatar(m,44)}<div style="flex:1"><b style="font-size:16px">${esc(m.name)}</b><div class="small mut">${esc(grp(m.group)?.name||'')} · ${esc(sched(m)?.name||'')}</div></div><span class="chip" style="color:${ST_COLOR[st]}">${ST_LABEL[st]}</span></div>
 <div class="row between"><div class="datenav"><button data-act="sheetNav" data-n="-7">${ic('left')}</button><div class="dlabel" style="min-width:150px">${fmtDate(ws,{day:'numeric',month:'short'})} – ${fmtDate(we,{day:'numeric',month:'short'})}</div><button data-act="sheetNav" data-n="7">${ic('right')}</button></div>${apChip(mid,ws)}</div>
 <div class="grid3" style="margin:14px 0"><div class="card stat"><div class="k">Tracked</div><div class="v" style="font-size:18px">${HM(sp.total)}</div></div><div class="card stat"><div class="k">Overtime</div><div class="v" style="font-size:18px">${HM(sp.ot)}</div></div><div class="card stat"><div class="k">Gross pay</div><div class="v" style="font-size:18px">${money(payFor(mid,ws,we))}</div></div></div>`;
 for(let i=0;i<7;i++){const d=addDays(ws,i);const es=entriesFor(mid,d,d).sort((a,b)=>a.in-b.in);const lv=leaveOn(mid,d),hol=isHoliday(d,mid);
  body+=`<div class="dayhead"><span>${fmtDate(d)} ${d===today()?'<span class="chip blue">Today</span>':''} ${lv?`<span class="chip blue">${esc(policy(lv.policy)?.name)}</span>`:''}${hol?`<span class="chip purple">${esc(hol.name)}</span>`:''}${isLate(mid,d)?'<span class="chip amber">Late</span>':''}</span><span class="row" style="gap:6px"><span>${es.length?HM(dayTotal(mid,d)):''}</span><button class="btn ghost sm" data-act="newEntry" data-id="${mid}" data-d="${d}" title="Add entry">${ic('plus',14)}</button></span></div>`;
  body+=es.map(e=>`<div class="entry"><span class="bar8" style="background:${act(e.activity)?.color||'var(--grey)'}"></span><div><b>${tsHM(e.in)} – ${e.out?tsHM(e.out):'<span class="okc">now</span>'}</b>${e.brk||e.brkStart?` <span class="small mut">· ${e.brk||0}${e.brkStart?'+':''} min break</span>`:''}${e.manual?' <span class="chip">Manual</span>':''}<div class="small mut">${esc(act(e.activity)?.name||'No activity')}${e.project?' · '+esc(proj(e.project)?.name):''}${e.location?' · '+esc(locn(e.location)?.name):''}</div>${e.note?`<div class="small">${esc(e.note)}</div>`:''}${e.photoIn||e.photoOut?`<div class="row" style="gap:6px;margin-top:6px">${photoThumbs(e)}</div>`:''}</div><div class="row" style="gap:4px"><b>${HM(eDur(e))}</b><button class="btn ghost sm" data-act="editEntry" data-id="${e.id}">${ic('edit',14)}</button></div></div>`).join('')}
 const can=isAdmin()||m.id===S.me;
 openDrawer('Timesheet',body,`${st==='out'?(can?`<button class="btn" data-act="clockIn" data-id="${mid}">${ic('play',14)} Clock in</button>`:''):`<button class="btn" data-act="${st==='break'?'endBreak':'startBreak'}" data-id="${mid}">${ic('coffee',14)} ${st==='break'?'End break':'Break'}</button><button class="btn danger" data-act="clockOut" data-id="${mid}">${ic('stop',12)} Clock out</button>`}${isAdmin()&&m.id!==S.me||S.members.length===1?(ap?`<button class="btn" data-act="approve" data-id="${mid}" data-ws="${ws}" data-s="reset">Undo approval</button>`:`<button class="btn pri" data-act="approve" data-id="${mid}" data-ws="${ws}" data-s="approved">${ic('check',14)} Approve</button>`):''}`)}
A.memberSheet=el=>memberSheet(el.dataset.id,el.dataset.ws||weekStartOf(U.tsTab==='sheets'&&U.view==='timesheets'?U.tsDate:today()));
A.sheetNav=el=>memberSheet(D.mid,addDays(D.ws,+el.dataset.n));
A.approve=(el,e)=>{e?.stopPropagation();const k=apKey(el.dataset.id,el.dataset.ws);if(el.dataset.s==='reset')delete S.approvals[k];else{S.approvals[k]={status:el.dataset.s,by:S.me,at:Date.now()};if(el.dataset.s==='rejected')notify('clock',`Timesheet for ${mem(el.dataset.id).name} (${fmtDate(el.dataset.ws,{day:'numeric',month:'short'})}) was rejected`)}save();const reopen=D&&D.kind==='sheet';render();if(reopen)memberSheet(D.mid,D.ws);toast(el.dataset.s==='reset'?'Approval removed':el.dataset.s==='approved'?'Timesheet approved':'Timesheet rejected')};

/* ---- entry editor ---- */
function entryDrawer(e,ret){const isNew=!e.id;D={kind:'entry',ret,id:e.id,member:e.member,date:tsYmd(e.in),start:tsHM(e.in),end:e.out==null?'':tsHM(e.out),brk:e.brk||0,activity:e.activity||'',project:e.project||'',location:e.location||'',note:e.note||''};
 const ws=weekStartOf(D.date);const locked=S.settings.approvals.lock&&apOf(D.member,ws)?.status==='approved';
 openDrawer(isNew?'Add time entry':'Edit time entry',`${locked?`<div class="chip amber" style="margin-top:14px;white-space:normal">This week is approved. Changes will need re-approval.</div>`:''}
 ${fld('Member',drSel('member',activeMembers(),D.member))}${fld('Date',drIn('date',D.date,'date'))}<div class="grid2"><div>${fld('Clock in',drIn('start',D.start,'time'))}</div><div>${fld('Clock out',drIn('end',D.end,'time'))}</div></div><div class="small mut" style="margin-top:4px">Leave clock out empty if they're still working. An earlier clock-out time than clock-in means the shift ended the next day.</div>
 ${fld('Break (minutes)',drIn('brk',D.brk,'number','min="0"'))}${fld('Activity',drSel('activity',S.activities,D.activity,{none:'No activity'}))}${fld('Project',drSel('project',S.projects,D.project,{none:'No project'}))}${fld('Location',drSel('location',S.locations,D.location,{none:'No location'}))}${fld('Note',`<textarea class="inp" data-dr="note">${esc(D.note)}</textarea>`)}`,
 `${isNew?'':`<button class="btn danger" data-act="delEntry" style="flex:0">${ic('trash',16)}</button>`}<button class="btn" data-act="entryBack">Cancel</button><button class="btn pri" data-act="saveEntry">Save</button>`)}
A.newEntry=(el,ev)=>{ev?.stopPropagation();const mid=el.dataset.id||(D&&D.kind==='sheet'?D.mid:S.me);const d=el.dataset.d||(U.view==='timesheets'&&U.tsMode==='day'?U.tsDate:today());const sc=sched(mem(mid));let day=sc?.days[dow(d)]||['09:00','17:30'];if(d===today()&&atHM(d,day[1])>Date.now()){const n=new Date();const e=Math.max(60,n.getHours()*60+n.getMinutes());day=[fromMin(Math.max(0,e-60)),fromMin(e)]}const ret=D&&D.kind==='sheet'?{mid:D.mid,ws:D.ws}:null;entryDrawer({member:mid,in:atHM(d,day[0]),out:atHM(d,day[1]),brk:d===today()?0:(sc?.breakMins||0),activity:'',project:'',location:S.locations[0]?.id||''},ret)};
A.editEntry=el=>{const e=S.entries.find(x=>x.id===el.dataset.id);const ret=D&&D.kind==='sheet'?{mid:D.mid,ws:D.ws}:null;entryDrawer(e,ret)};
A.entryBack=()=>{const r=D.ret;if(r)memberSheet(r.mid,r.ws);else closeDrawer()};
A.saveEntry=()=>{if(!D.date||!D.start)return toast('Enter a date and clock-in time');const inT=atHM(D.date,D.start);let outT=D.end?atHM(D.date,D.end):null;if(outT!=null&&outT<=inT)outT+=864e5;
 if(inT>Date.now())return toast("Clock-in can't be in the future");if(outT!=null&&outT>Date.now()+6e4)return toast("Clock-out can't be in the future");if(outT==null){if(inT>Date.now())return toast("Clock-in can't be in the future for a running entry");const other=openEntry(D.member);if(other&&other.id!==D.id)return toast('This member already has a running entry')}
 if(outT!=null&&(outT-inT)>24*36e5)return toast('An entry can be at most 24 hours');const brk=Math.max(0,Math.round(+D.brk||0));if(outT!=null&&brk*6e4>=outT-inT)return toast('Break is longer than the entry');
 const l=locn(D.location);let e=S.entries.find(x=>x.id===D.id);if(!e){e={id:uid(),manual:true,source:'manual',brkStart:null};S.entries.push(e)}
 Object.assign(e,{member:D.member,in:inT,out:outT,brk,activity:D.activity,project:D.project,location:D.location,note:D.note,lat:e.location===D.location&&e.lat!=null?e.lat:l?.lat??null,lng:e.location===D.location&&e.lng!=null?e.lng:l?.lng??null});if(outT!=null)e.brkStart=null;S.entries.sort((a,b)=>a.in-b.in);save();const r=D.ret;render();if(r)memberSheet(r.mid,r.ws);else closeDrawer();toast('Time entry saved')};
A.delEntry=()=>{const id=D.id,r=D.ret;ask('This time entry will be removed from timesheets and reports.',()=>{S.entries=S.entries.filter(e=>e.id!==id);save();render();if(r)memberSheet(r.mid,r.ws);else closeDrawer();toast('Time entry deleted')})};

/* ---- time off ---- */
function leaveDrawer(r){const isNew=!r.id;D={kind:'leave',...r};const m=mem(D.member);
 const body=()=>{const days=D.start&&D.end&&D.end>=D.start?leaveDays(D):0;const p=policy(D.policy);const used=leaveUsed(D.member,D.policy,(D.start||today()).slice(0,4));
  return`${fld('Member',drSel('member',isAdmin()?activeMembers():[me()],D.member))}${fld('Policy',drSel('policy',S.timeoff.policies.filter(p=>(!p.archived&&policyFor(p,D.member))||p.id===D.policy),D.policy))}<div class="grid2"><div>${fld('From',drIn('start',D.start,'date'))}</div><div>${fld('To',drIn('end',D.end,'date'))}</div></div><label class="row small" style="margin-top:10px;gap:8px"><input type="checkbox" data-dr="half" ${D.half?'checked':''}> Half day</label>${fld('Note',`<textarea class="inp" data-dr="note">${esc(D.note||'')}</textarea>`)}
  ${isAdmin()?fld('Status',`<select class="inp" data-dr="status">${['pending','approved','rejected'].map(s=>`<option value="${s}" ${D.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select>`):''}
  <div class="card pad" style="margin-top:14px;background:var(--bg)"><div class="row between"><span>Working days requested</span><b>${days}</b></div>${p&&+p.allowance?`<div class="row between small mut" style="margin-top:6px"><span>${esc(p.name)} balance after this</span><b>${+p.allowance-used-(D.status==='approved'&&!isNew?0:days)} of ${p.allowance}</b></div>`:''}</div>`};
 D.render=()=>{$('#drawer .dr-body').innerHTML=body()};
 openDrawer(isNew?'Add time off':'Time off request',body(),`${isNew?'':`<button class="btn danger" data-act="delLeave" style="flex:0">${ic('trash',16)}</button>`}<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn pri" data-act="saveLeave">${isNew?'Submit':'Save'}</button>`)}

A.saveLeave=()=>{if(!D.start||!D.end||D.end<D.start)return toast('Check the dates');if(!leaveDays(D))return toast('No working days in that range');const clash=S.timeoff.requests.find(r=>r.id!==D.id&&r.member===D.member&&r.status!=='rejected'&&r.start<=D.end&&r.end>=D.start);if(clash)return toast('Overlaps another request for this member');
 const isNew=!D.id;const{kind,render:_r,...rec}=D;if(isNew){rec.id=uid();rec.at=Date.now();S.timeoff.requests.push(rec);notify('plane',`${mem(rec.member).name} ${rec.status==='pending'?'requested':'was given'} ${leaveDays(rec)} day${leaveDays(rec)!==1?'s':''} of ${policy(rec.policy).name}`)}else Object.assign(S.timeoff.requests.find(r=>r.id===rec.id),rec);save();closeDrawer();render();toast(isNew?'Time off added':'Saved')};
A.delLeave=()=>{const id=D.id;ask('This time off request will be deleted.',()=>{S.timeoff.requests=S.timeoff.requests.filter(r=>r.id!==id);save();closeDrawer();render();toast('Deleted')})};
A.leaveStatus=(el,e)=>{e?.stopPropagation();const r=S.timeoff.requests.find(x=>x.id===el.dataset.id);r.status=el.dataset.s;r.decidedBy=S.me;save();render();toast(`Request ${r.status}`)};

 openDrawer(isNew?'Add member':'Edit member',`<div class="row" style="margin-top:14px">${isNew?'':avatar(m,44)}<div class="small mut">${isNew?'New members can clock in from the kiosk with their PIN.':`Joined ${fmtLong(m.joined)}`}</div></div>

 ${fld('Work schedule',drSel('schedule',S.schedules,D.schedule))}<div class="grid2"><div>${fld(`Pay rate (${S.org.currency}/h)`,drIn('rate',D.rate,'number','min="0" step="0.01"'))}</div><div>${fld(`Bill rate (${S.org.currency}/h)`,drIn('billRate',D.billRate,'number','min="0" step="0.01"'))}</div></div><div class="grid2"><div>${fld('Kiosk PIN (4 digits)',drIn('pin',D.pin,'text','maxlength="4" inputmode="numeric"'))}</div><div>${fld('Colour',`<input type="color" class="inp" style="height:40px;padding:4px" value="${D.color}" data-dr="color">`)}</div></div>

 `${!isNew&&m.id!==S.me?`<button class="btn" data-act="archMember" style="flex:0" title="${m.archived?'Restore':'Archive'}">${ic('archive',16)}</button>`:''}<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn pri" data-act="saveMember">${isNew?'Add member':'Save'}</button>`)}

 const{kind,...rec}=D;rec.name=rec.name.trim();rec.rate=+rec.rate||0;rec.billRate=+rec.billRate||0;if(!rec.id){rec.id=uid();rec.joined=today();S.members.push(rec);S.setup.team=true;toast(`${rec.name} added`)}else{Object.assign(mem(rec.id),rec);toast('Saved')}save();closeDrawer();render()};

A.editSchedule=el=>{const id=el.dataset.id;const sc=id?JSON.parse(JSON.stringify(S.schedules.find(s=>s.id===id))):{name:'',type:'fixed',days:{1:['09:00','17:00'],2:['09:00','17:00'],3:['09:00','17:00'],4:['09:00','17:00'],5:['09:00','17:00']},flexHours:8,breakMins:30,dailyOT:8,weeklyOT:40,isDefault:!S.schedules.length};D={kind:'sched',...sc};renderSchedDrawer()};
function renderSchedDrawer(){const dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const order=[1,2,3,4,5,6,0];
 openDrawer(D.id?'Edit schedule':'New work schedule',`${fld('Schedule name *',drIn('name',D.name))}${fld('Type',`<div class="seg"><button class="${D.type==='fixed'?'on':''}" data-act="schedType" data-v="fixed">Fixed</button><button class="${D.type==='flexible'?'on':''}" data-act="schedType" data-v="flexible">Flexible</button></div>`)}
 <div class="small mut" style="margin-top:6px">${D.type==='fixed'?'Set start and end times. Clock-ins after the start time count as late.':'Members work a set number of hours each day, at any time.'}</div>
 ${fld('Working days','')}${order.map(d=>`<div class="hours-row" style="grid-template-columns:110px 1fr 1fr"><label class="row" style="gap:8px"><input type="checkbox" data-sday="${d}" ${D.days[d]?'checked':''}> ${dn[d].slice(0,3)}</label>${D.days[d]&&D.type==='fixed'?`<input class="inp" type="time" value="${D.days[d][0]}" data-stime="${d}:0"><input class="inp" type="time" value="${D.days[d][1]}" data-stime="${d}:1">`:`<span class="mut small">${D.days[d]?'Working day':'Day off'}</span><span></span>`}</div>`).join('')}
 ${D.type==='flexible'?fld('Hours per day',drIn('flexHours',D.flexHours,'number','min="0" step="0.5"')):''}${fld('Break (minutes, deducted automatically if not tracked)',drIn('breakMins',D.breakMins,'number','min="0"'))}<div class="grid2"><div>${fld('Daily overtime after (h)',drIn('dailyOT',D.dailyOT,'number','min="0" step="0.5"'))}</div><div>${fld('Weekly overtime after (h)',drIn('weeklyOT',D.weeklyOT,'number','min="0" step="0.5"'))}</div></div>
 <label class="row" style="margin-top:14px;gap:8px"><input type="checkbox" data-dr="isDefault" ${D.isDefault?'checked':''}> Default schedule for new members</label>`,
 `${D.id&&!D.isDefault?`<button class="btn danger" data-act="delSchedule" style="flex:0">${ic('trash',16)}</button>`:''}<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn pri" data-act="saveSchedule">Save</button>`)}

 const{kind,...rec}=D;['flexHours','breakMins','dailyOT','weeklyOT'].forEach(k=>rec[k]=+rec[k]||0);if(rec.isDefault)S.schedules.forEach(s=>s.isDefault=false);if(!rec.id){rec.id=uid();S.schedules.push(rec)}else Object.assign(S.schedules.find(s=>s.id===rec.id),rec);if(!S.schedules.some(s=>s.isDefault))S.schedules[0].isDefault=true;S.setup.schedule=true;save();closeDrawer();render();toast('Schedule saved')};

function period(q){if(/yesterday/.test(q))return['yesterday','yesterday'];if(/last week/.test(q))return['lastweek','last week'];if(/last month/.test(q))return['lastmonth','last month'];if(/this month|month/.test(q))return['month','this month'];if(/today|now|right now|currently/.test(q))return['day','today'];return['week','this week']}
const tbl=(head,rows)=>`<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function aiAnswer(raw){const q=raw.toLowerCase();const ms=activeMembers();const named=ms.find(m=>q.includes(m.name.toLowerCase())||q.includes(m.name.split(' ')[0].toLowerCase()));const[pk,pl]=period(q);const[f,t]=rangeFor(pk);
 if(/^(hi|hello|hey)\b|help|what can you/.test(q))return`I can answer questions about your workspace, for example:<br>• who's clocked in, on a break or late<br>• hours worked by a person, team, project or activity<br>• overtime and payroll cost<br>• who's off and upcoming holidays<br>Try “How many hours did ${esc(ms[1]?.name.split(' ')[0]||'Priya')} work last week?”`;
 if(/clocked in|who.*(in|working|online)|on (a )?break|who.*out\b/.test(q)&&!/hours|overtime|late/.test(q)){const ins=ms.filter(m=>status(m.id)==='in'),br=ms.filter(m=>status(m.id)==='break');if(!ins.length&&!br.length)return'Nobody is clocked in right now.';return`<b>${ins.length}</b> clocked in${br.length?`, <b>${br.length}</b> on a break`:''}:${tbl(['Member','Since','Activity','Location'],[...ins,...br].map(m=>{const e=openEntry(m.id);return[esc(m.name)+(status(m.id)==='break'?' ☕':''),tsHM(e.in),esc(act(e.activity)?.name||'—'),esc(locn(e.location)?.name||'—')]}))}`}
 if(/late/.test(q)){const[k2,l2]=/week|month/.test(q)?[pk,pl]:['day','today'];const[a,b]=rangeFor(k2);const rows=[];let d=a;while(d<=b){ms.forEach(m=>{if(isLate(m.id,d))rows.push([esc(m.name),fmtDate(d),tsHM(firstIn(m.id,d)),Object.values(sched(m).days)[0]?.[0]||''])});d=addDays(d,1)}return rows.length?`${rows.length} late arrival${rows.length>1?'s':''} ${l2}:${tbl(['Member','Date','Clocked in','Scheduled'],rows)}`:`No late arrivals ${l2}. 🎉`}
 if(/overtime|\bot\b/.test(q)){const rows=ms.map(m=>({m,s:splitOT(m.id,f,t)})).filter(r=>r.s.ot>0).sort((a,b)=>b.s.ot-a.s.ot);return rows.length?`Overtime ${pl}:${tbl(['Member','Overtime','Total'],rows.map(r=>[esc(r.m.name),HM(r.s.ot),HM(r.s.total)]))}`:`Nobody has overtime ${pl}.`}
 if(/payroll|cost|wage|pay\b|salar/.test(q)){const rows=ms.map(m=>[esc(m.name),HM(splitOT(m.id,f,t).total),money(payFor(m.id,f,t))]);const tot=ms.reduce((a,m)=>a+payFor(m.id,f,t),0);return`Estimated gross payroll ${pl} is <b>${money(tot)}</b> (overtime at ×${S.settings.otMultiplier}).${tbl(['Member','Hours','Gross pay'],rows)}`}
 if(/off|holiday|leave|vacation|absent|sick/.test(q)){const[a,b]=/next week/.test(q)?(()=>{const s=addDays(weekStartOf(today()),7);return[s,addDays(s,6)]})():/today/.test(q)?[today(),today()]:/month/.test(q)?rangeFor('month'):rangeFor('week');const label=/next week/.test(q)?'next week':/today/.test(q)?'today':/month/.test(q)?'this month':'this week';
  const rs=S.timeoff.requests.filter(r=>r.status!=='rejected'&&r.start<=b&&r.end>=a);const hs=S.timeoff.holidays.filter(h=>h.date>=a&&h.date<=b);if(!rs.length&&!hs.length)return`Nobody is off ${label}, and there are no holidays.`;
  return`${rs.length?`Time off ${label}:${tbl(['Member','Type','Dates','Status'],rs.map(r=>[esc(mem(r.member)?.name),esc(policy(r.policy)?.name),`${fmtDate(r.start)}${r.end!==r.start?' – '+fmtDate(r.end):''}`,r.status]))}`:`Nobody has time off ${label}.`}${hs.length?`<br>Holidays: ${hs.map(h=>`<b>${esc(h.name)}</b> (${fmtDate(h.date)})`).join(', ')}`:''}`}
 if(FEATURES.invoices&&/invoice|owe|unpaid|overdue|outstanding|paid/.test(q)){const od=S.invoices.filter(v=>invStatus(v)==='overdue'),out=S.invoices.filter(v=>v.status==='sent');const sum=a=>money(a.reduce((x,v)=>x+invTotals(v).total,0));if(/overdue/.test(q))return od.length?`${od.length} overdue invoice${od.length>1?'s':''} totalling <b>${sum(od)}</b>:${tbl(['Invoice','Client','Due','Amount'],od.map(v=>[esc(v.number),esc(client(v.client)?.name),fmtDate(v.due),money(invTotals(v).total,v.currency)]))}`:'No invoices are overdue.';
  return`Outstanding: <b>${sum(out)}</b> across ${out.length} invoice${out.length!==1?'s':''}${od.length?`, of which <b>${sum(od)}</b> is overdue`:''}. Drafts: ${S.invoices.filter(v=>v.status==='draft').length}.${out.length?tbl(['Invoice','Client','Due','Amount','Status'],out.map(v=>[esc(v.number),esc(client(v.client)?.name),v.due?fmtDate(v.due):'—',money(invTotals(v).total,v.currency),INV_CHIP[invStatus(v)][1]])):''}`}
 const es=S.entries.filter(e=>tsYmd(e.in)>=f&&tsYmd(e.in)<=t&&(!named||e.member===named.id));
 if(/project|client/.test(q)){const g={};es.forEach(e=>{const k=/client/.test(q)?(client(proj(e.project)?.client)?.name||'No client'):(proj(e.project)?.name||'No project');g[k]=(g[k]||0)+eDur(e)});const rows=Object.entries(g).sort((a,b)=>b[1]-a[1]);return rows.length?`Hours by ${/client/.test(q)?'client':'project'} ${pl}${named?' for '+esc(named.name):''}:${tbl([/client/.test(q)?'Client':'Project','Hours'],rows.map(r=>[esc(r[0]),HM(r[1])]))}`:`No tracked time ${pl}.`}
 if(/activit/.test(q)){const g={};es.forEach(e=>{const k=act(e.activity)?.name||'No activity';g[k]=(g[k]||0)+eDur(e)});const rows=Object.entries(g).sort((a,b)=>b[1]-a[1]);return rows.length?`Hours by activity ${pl}:${tbl(['Activity','Hours'],rows.map(r=>[esc(r[0]),HM(r[1])]))}`:`No tracked time ${pl}.`}
 if(/hour|work|track|timesheet|time/.test(q)||named){if(named){const s=splitOT(named.id,f,t);return`<b>${esc(named.name)}</b> tracked <b>${HM(s.total)}</b> ${pl}${s.ot?` including ${HM(s.ot)} overtime`:''}. Status now: ${ST_LABEL[status(named.id)].toLowerCase()}.`}
  const rows=ms.map(m=>[m,splitOT(m.id,f,t).total]).sort((a,b)=>b[1]-a[1]);const tot=rows.reduce((a,r)=>a+r[1],0);return`The team tracked <b>${HM(tot)}</b> ${pl}.${tbl(['Member','Hours'],rows.map(r=>[esc(r[0].name),HM(r[1])]))}`}
 return`I couldn't match that to your data. I can help with hours, overtime, payroll, attendance and time off — try one of the suggestions below.`}
function aiAsk(q){q=q.trim();if(!q)return;S.ai.push({r:'u',t:q,at:Date.now()});let a;try{a=aiAnswer(q)}catch(e){a='Sorry, something went wrong answering that.'}S.ai.push({r:'a',t:a,at:Date.now()});S.ai=S.ai.slice(-60);save();render()}
A.aiAsk=el=>aiAsk(el.dataset.q);
A.aiSend=f=>{aiAsk(f.querySelector('#aiInput').value)};
A.aiClear=()=>{S.ai=[];save();render()};

/* ================= kiosk ================= */
let K=null;
A.kiosk=()=>{if(!S.settings.policies.kiosk)return toast('Kiosk is turned off in Time Tracking settings');K={step:'pick',mid:null,pin:''};renderKiosk()};
function renderKiosk(){const el=$('#kiosk');if(!K){el.innerHTML='';return}const now=new Date();let body='';
 if(K.step==='pick')body=`<div class="small" style="color:#8b8b95">Tap your name to clock in or out</div><div class="kgrid">${activeMembers().map(m=>`<button data-act="kPick" data-id="${m.id}">${avatar(m,48)}${esc(m.name)}<span class="small" style="color:${ST_COLOR[status(m.id)]}">${ST_LABEL[status(m.id)]}</span></button>`).join('')}</div>`;
 else if(K.step==='pin'){const m=mem(K.mid);body=`${avatar(m,64)}<b style="font-size:20px">${esc(m.name)}</b><div style="color:#8b8b95">Enter your 4-digit PIN</div><div class="pindots">${[0,1,2,3].map(i=>`<i class="${K.pin.length>i?'f':''}"></i>`).join('')}</div><div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="kDigit" data-n="${n}">${n}</button>`).join('')}<button data-act="kBack">${ic('left',20)}</button><button data-act="kDigit" data-n="0">0</button><button data-act="kDel">⌫</button></div>`}
 else if(K.step==='act'){const m=mem(K.mid);const st=status(m.id);const e=openEntry(m.id);body=`${avatar(m,64)}<b style="font-size:22px">Hi ${esc(m.name.split(' ')[0])}</b><div style="color:#8b8b95">${st==='out'?`Today: ${HM(dayTotal(m.id,today()))}`:`${ST_LABEL[st]} since ${tsHM(e.in)} · ${HMS(eDur(e))}`}</div>
  ${st==='out'?`<div style="color:#8b8b95;margin-top:6px">What are you working on?</div><div class="kgrid" style="max-width:640px">${activeActs().map(a=>`<button data-act="kIn" data-a="${a.id}" style="border-color:${a.color}"><span class="swatch" style="background:${a.color};width:18px;height:18px"></span>${esc(a.name)}</button>`).join('')}</div>`:`<div class="row" style="gap:12px">${st==='break'?`<button class="btn" style="padding:14px 24px;font-size:16px" data-act="kBreak">${ic('play',16)} End break</button>`:`<button class="btn" style="padding:14px 24px;font-size:16px" data-act="kBreak">${ic('coffee',16)} Start break</button>`}<button class="btn pri" style="padding:14px 24px;font-size:16px;background:var(--bad)" data-act="kOut">${ic('stop',14)} Clock out</button></div>`}
  <button class="btn ghost" style="color:#c9c9d1" data-act="kBack">Not you? Go back</button>`}
 else if(K.step==='done')body=`<div style="width:90px;height:90px;border-radius:50%;background:var(--ok);display:grid;place-items:center">${ic('check',48)}</div><b style="font-size:24px">${esc(K.msg)}</b>`;
 el.innerHTML=`<div class="kiosk"><div style="position:absolute;top:18px;left:22px" class="wordmark">Proview <span>Kiosk</span></div><button class="btn" style="position:absolute;top:14px;right:18px;background:#23232a;border-color:#33333c;color:#ddd" data-act="kExit">${ic('x',16)} Exit kiosk</button><div class="kclock" id="kclock">${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div><div style="color:#8b8b95;margin-top:-14px">${now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>${body}</div>`}
A.kExit=()=>{camClose(null);K=null;renderKiosk();render()};
A.kPick=el=>{K={step:'pin',mid:el.dataset.id,pin:''};renderKiosk()};
A.kBack=()=>{camClose(null);K={step:'pick',mid:null,pin:''};renderKiosk()};
A.kDel=()=>{K.pin=K.pin.slice(0,-1);renderKiosk()};
A.kDigit=el=>{if(K.pin.length>=4)return;K.pin+=el.dataset.n;renderKiosk();if(K.pin.length===4){if(K.pin===String(mem(K.mid).pin||'')){if(checksNeeded().face){const mid=K.mid;camera({mode:'face',mid,title:'Verify your face'}).then(r=>{if(!K||K.mid!==mid)return;if(!r){K={step:'pick',mid:null,pin:''};renderKiosk();return}K.verify=r;K.step='act';renderKiosk()});return}K.step='act';renderKiosk()}else{toast('Wrong PIN');K.pin='';setTimeout(renderKiosk,250)}}};
function kDone(msg){K.step='done';K.msg=msg;renderKiosk();setTimeout(()=>{if(K&&K.step==='done'){K={step:'pick',mid:null,pin:''};renderKiosk()}},2200)}
A.kIn=async el=>{const m=mem(K.mid);let r=K.verify||null;if(!r&&checksNeeded().selfie){r=await camera({mode:'selfie',mid:m.id,title:'Take a selfie to clock in'});if(!r||!K)return}if(openEntry(m.id))return;const last=S.entries.filter(e=>e.member===m.id).slice(-1)[0];const l=locn(last?.location)||S.locations[0];const ne={id:uid(),member:m.id,in:Date.now(),out:null,brk:0,brkStart:null,activity:el.dataset.a,project:last?.project||'',location:l?.id||'',lat:l?.lat??null,lng:l?.lng??null,note:'',manual:false,source:'kiosk'};stampPhoto(ne,'In',r);S.entries.push(ne);K.verify=null;save();kDone(`${m.name.split(' ')[0]} clocked in at ${tsHM(Date.now())}`)};
A.kOut=async()=>{const m=mem(K.mid);let r=K.verify||null;if(!r&&checksNeeded().selfie){r=await camera({mode:'selfie',mid:m.id,title:'Take a selfie to clock out'});if(!r||!K)return}const e=doClockOut(m.id);if(!e)return;stampPhoto(e,'Out',r);K.verify=null;save();kDone(`See you later, ${m.name.split(' ')[0]} · ${HM(dayTotal(m.id,today()))} today`)};
A.kBreak=()=>{const e=openEntry(K.mid);if(e.brkStart){e.brk=(e.brk||0)+Math.round((Date.now()-e.brkStart)/6e4);e.brkStart=null;save();kDone('Break ended — welcome back')}else{e.brkStart=Date.now();save();kDone('Enjoy your break')}};

/* ================= camera, selfies & face recognition ================= */
const FACE_LIB='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/dist/face-api.js';
const FACE_MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/model/';
const FACE_THRESHOLD=0.5; // lower = stricter match
let FACEP=null;
function loadFaceApi(){if(window.faceapi&&window.faceapi.__ready)return Promise.resolve(window.faceapi);if(FACEP)return FACEP;
 FACEP=new Promise((res,rej)=>{const go=async()=>{try{const f=window.faceapi;await f.nets.tinyFaceDetector.loadFromUri(FACE_MODELS);await f.nets.faceLandmark68Net.loadFromUri(FACE_MODELS);await f.nets.faceRecognitionNet.loadFromUri(FACE_MODELS);f.__ready=true;res(f)}catch(e){FACEP=null;rej(e)}};
  if(window.faceapi)return go();const s=document.createElement('script');s.src=FACE_LIB;s.onload=go;s.onerror=()=>{FACEP=null;rej(new Error('Face recognition could not load'))};document.head.appendChild(s)});return FACEP}
async function faceDescriptor(f,el){const r=await f.detectSingleFace(el,new f.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();return r?r.descriptor:null}
function snap(video,w=240){const c=document.createElement('canvas');const r=(video.videoHeight||3)/(video.videoWidth||4);c.width=w;c.height=Math.round(w*r);const x=c.getContext('2d');x.translate(w,0);x.scale(-1,1);x.drawImage(video,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
let CAM=null;
function camClose(result){if(!CAM)return;const c=CAM;CAM=null;clearTimeout(c.timer);c.stopped=true;try{c.stream&&c.stream.getTracks().forEach(t=>t.stop())}catch(e){}$('#cam').innerHTML='';c.resolve(result)}
function camStatus(t,kind=''){const s=$('#camStatus');if(s){s.textContent=t;s.className='cam-status '+kind}}
/* mode: 'selfie' (manual photo) | 'enrol' (photo + face template) | 'face' (auto-scan and compare with member's template) */
function camera({mode,mid,title}){return new Promise(async resolve=>{if(CAM)camClose(null);const m=mem(mid);CAM={resolve,mode,mid};
 $('#cam').innerHTML=`<div class="cam-wrap"><div class="cam-box"><b style="font-size:18px">${esc(title)}</b><div class="small" style="color:#9a9aa5">${esc(m?.name||'')}</div><div class="cam-frame"><video id="camVideo" autoplay playsinline muted></video><div class="cam-ring"></div></div><div id="camStatus" class="cam-status">Starting camera…</div><div class="row" style="justify-content:center;gap:10px">${mode==='face'?`<button class="btn" data-act="camRetry" id="camRetry" style="display:none">Try again</button>`:`<button class="btn pri" data-act="camShoot" id="camShoot" disabled>Take photo</button>`}<button class="btn" data-act="camCancel">Cancel</button></div></div></div>`;
 if(!navigator.mediaDevices?.getUserMedia){camStatus('This browser has no camera access. Use HTTPS and a device with a camera.','bad');return}
 try{CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false})}catch(e){if(CAM)camStatus('Camera blocked or not found — allow camera access for this site and try again.','bad');return}
 if(!CAM){return}const v=$('#camVideo');v.srcObject=CAM.stream;await new Promise(r=>{if(v.readyState>=2)r();else v.onloadeddata=()=>r()});if(!CAM)return;
 if(mode==='selfie'){camStatus('Look at the camera and take your photo');$('#camShoot').disabled=false;return}
 camStatus('Loading face recognition…');let f;try{f=await loadFaceApi()}catch(e){if(CAM)camStatus('Face recognition couldn\'t load — check the internet connection.','bad');return}if(!CAM)return;
 if(mode==='enrol'){camStatus('Face the camera in good light, then take the photo');$('#camShoot').disabled=false;CAM.f=f;return}
 const ref=m?.face?.descriptor;if(!ref){camStatus('No face photo on file. Ask a manager to add one in People.','bad');return}
 CAM.f=f;CAM.ref=new Float32Array(ref);faceScan()})}
async function faceScan(){const c=CAM;if(!c||c.stopped)return;$('#camRetry')&&($('#camRetry').style.display='none');camStatus('Scanning… look at the camera');c.deadline=Date.now()+15000;c.best=9;
 const tick=async()=>{if(!CAM||CAM!==c||c.stopped)return;const v=$('#camVideo');let d=null;try{d=await faceDescriptor(c.f,v)}catch(e){}
  if(!CAM||CAM!==c)return;
  if(d){const dist=c.f.euclideanDistance(d,c.ref);c.best=Math.min(c.best,dist);if(dist<FACE_THRESHOLD){camStatus('Face recognised ✓','ok');const photo=snap(v);setTimeout(()=>camClose({photo,verified:'face',score:+dist.toFixed(3)}),500);return}camStatus('Face doesn\'t match — hold still…','warn')}else camStatus('No face detected — move closer to the camera');
  if(Date.now()>c.deadline){camStatus('Face not recognised. Try again in better light, or ask a manager.','bad');$('#camRetry').style.display='';return}
  c.timer=setTimeout(tick,400)};tick()}
A.camRetry=()=>faceScan();
A.camCancel=()=>camClose(null);
A.camShoot=async()=>{const c=CAM;if(!c)return;const v=$('#camVideo');const photo=snap(v);
 if(c.mode==='selfie')return camClose({photo,verified:'selfie'});
 camStatus('Checking photo…');$('#camShoot').disabled=true;let d=null;try{d=await faceDescriptor(c.f,v)}catch(e){}if(!CAM)return;
 if(!d){camStatus('No face found — face the camera and try again.','bad');$('#camShoot').disabled=false;return}
 camClose({photo:snap(v,200),descriptor:Array.from(d).map(x=>+x.toFixed(5))})};
/* what the clock-in rules require for a member clocking themselves */
function checksNeeded(){const P=S.settings.policies;return{face:!!P.face,selfie:!!P.selfie}}
async function verifyForClock(mid,what){const n=checksNeeded();if(!n.face&&!n.selfie)return{photo:null,verified:null};
 if(n.face){if(!mem(mid)?.face?.descriptor){toast(`${mem(mid)?.name.split(' ')[0]} has no face photo on file — add one in People`);return null}return await camera({mode:'face',mid,title:`Verify your face to ${what}`})}
 return await camera({mode:'selfie',mid,title:`Take a selfie to ${what}`})}
function stampPhoto(e,which,r){if(!r||!r.photo)return;e['photo'+which]=r.photo;e['ver'+which]=r.verified;if(r.score!=null)e['score'+which]=r.score}
function prunePhotos(){const cut=Date.now()-90*864e5;let n=0;S.entries.forEach(e=>{if(e.in<cut&&(e.photoIn||e.photoOut)){delete e.photoIn;delete e.photoOut;n++}});return n}
function photoThumbs(e){const t=(src,lab,ver)=>`<button class="thumb" data-act="viewPhoto" data-id="${e.id}" data-w="${lab}" title="${lab==='In'?'Clock-in':'Clock-out'} ${ver==='face'?'(face verified)':'selfie'}"><img src="${src}" alt=""><i>${ver==='face'?'✓':''}</i></button>`;return(e.photoIn?t(e.photoIn,'In',e.verIn):'')+(e.photoOut?t(e.photoOut,'Out',e.verOut):'')}
A.viewPhoto=el=>{const e=S.entries.find(x=>x.id===el.dataset.id);const w=el.dataset.w;const src=e['photo'+w];if(!src)return;openModal(`<div class="pad" style="text-align:center"><img src="${src}" alt="" style="width:100%;max-width:420px;border-radius:12px"><div style="margin-top:10px"><b>${esc(mem(e.member)?.name)}</b> · ${w==='In'?'Clock-in':'Clock-out'} ${tsHM(w==='In'?e.in:e.out)} on ${fmtDate(tsYmd(e.in))}</div><div class="small mut">${e['ver'+w]==='face'?`Face verified (match distance ${e['score'+w]})`:'Selfie'}</div><button class="btn" style="margin-top:12px" data-act="closeModal">Close</button></div>`,460)};
/* People: face photo for each member */
A.enrolFace=async()=>{const mid=D.id||'new';const keep=D;const r=await camera({mode:'enrol',mid:D.id,title:'Add face photo'});if(!r)return;keep.face={descriptor:r.descriptor,photo:r.photo,at:Date.now()};if(keep.id){mem(keep.id).face=keep.face;save();render()}memberDrawer(keep);toast('Face photo saved')};
A.removeFace=()=>{const keep=D;delete keep.face;if(keep.id){delete mem(keep.id).face;save();render()}memberDrawer(keep);toast('Face photo removed')};
