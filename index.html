function schedDayStart(sc,d){return sc&&sc.type==='fixed'&&sc.days[dow(d)]?atHM(d,sc.days[dow(d)][0]):null}
function dayWorked(mid,d){const m=mem(mid),sc=sched(m);const es=entriesFor(mid,d,d);if(!es.length)return 0;const st=sc&&!sc.includeBefore?schedDayStart(sc,d):null;
 let t=es.reduce((a,e)=>a+Math.max(0,eOut(e)-(st?Math.max(eIn(e),Math.min(st,eOut(e))):eIn(e))-eBreak(e)),0);
 const brk=es.reduce((a,e)=>a+eBreak(e),0);
 for(const r of [...(sc?.deductions||[])].sort((a,b)=>b.after-a.after)){if(t>r.after*36e5){const need=r.mins*6e4-brk;if(need>0)t-=need;break}}

 while(d<=to){const t=dayWorked(mid,d);if(t){const isH=!!isHoliday(d,mid),isRest=!workday(m,d);
   if(isH&&o.holiday.on)r.hol+=t;else if(isRest&&o.rest.on)r.rest+=t;
   else{let reg=t,dt=0,d1=0;if(o.double.on&&t>o.double.after*36e5){dt=t-o.double.after*36e5;reg-=dt}if(o.daily.on&&reg>o.daily.after*36e5){d1=reg-o.daily.after*36e5;reg-=d1}r.reg+=reg;r.otD+=d1;r.dot+=dt;const w=weekStartOf(d);weekReg[w]=(weekReg[w]||0)+reg}}
  d=addDays(d,1)}
 if(o.weekly.on){for(const w in weekReg){const ex=weekReg[w]-o.weekly.after*36e5;if(ex>0){r.otW+=ex;r.reg-=ex}}}

 r.extra=r.dot+r.rest+r.hol;return r};
payFor=function(mid,from,to){return splitOT(mid,from,to).pay};

leaveDays=function(r){const m=mem(r.member),p=policy(r.policy)||{};let n=0,d=r.start;while(d<=r.end){const wd=workday(m,d),hol=isHoliday(d,r.member);if((!p.excludeNonWorking||wd)&&(!p.excludeHolidays||!hol))n++;d=addDays(d,1)}return r.half?Math.min(n,1)*.5:n};
function hoursPerDay(m){const sc=sched(m);if(!sc)return 8;if(sc.type==='weekly')return(+sc.weekHours||40)/Math.max(1,Object.keys(sc.days).length);if(sc.type==='flexible'){const v=Object.values(sc.dayHours||{});return v.length?v.reduce((a,b)=>a+ +b,0)/v.length:8}const v=Object.values(sc.days)[0];return v?(toMin(v[1])-toMin(v[0]))/60-((sc.breaks||[]).filter(b=>!b.paid).reduce((a,b)=>a+b.mins,0))/60:8}

function shiftLabel(mid,d){const m=mem(mid);if(!m)return'';if(leaveOn(mid,d))return`<span class="chip blue">On leave</span>`;const sh=rotaShiftsFor(mid,d);if(!sh.length)return`<span class="chip amber">Not on the rota</span>`;return sh.map(s=>`<span class="chip ${s.published?'green':''}">${s.published?'On shift':'Draft shift'} ${s.start}–${s.end}</span>`).join(' ')}
const tasksOn=(mid,d)=>S.tasks.filter(t=>t.assignee===mid&&t.date===d);
function leastBusy(cands,d){return cands.slice().sort((a,b)=>tasksOn(a,d).filter(t=>t.status!=='done').length-tasksOn(b,d).filter(t=>t.status!=='done').length||a.localeCompare(b))[0]}
/* creates one or more task records; returns them */
function createTask(o,quiet){const base={id:'',title:o.title.trim(),description:o.description||'',date:o.date,time:o.time||'',location:o.location||'',activity:o.activity||'',priority:o.priority||'normal',status:'todo',checklist:(o.checklist||[]).map(c=>typeof c==='string'?{id:uid(),text:c,done:false}:{...c,id:c.id||uid()}),mode:o.mode||'person',need:o.need||'',createdBy:S.me,createdAt:Date.now(),template:o.template||''};
 let assignees=[];
 if(o.mode==='person')assignees=[o.assignee||''];
 else{const pool=[...new Set(shiftsOn(o.date,{need:o.need,location:o.need?'':o.location,time:o.need?'':o.time}).map(s=>s.member))];if(o.mode==='each')assignees=pool.length?pool:[''];else assignees=[pool.length?leastBusy(pool,o.date):'']}
 const made=assignees.map(a=>({...base,id:uid(),assignee:a,checklist:base.checklist.map(c=>({...c,id:uid()}))}));S.tasks.push(...made);
 made.forEach(t=>{if(t.assignee&&t.assignee!==S.me)notify('task',`${mem(t.assignee).name.split(' ')[0]} was given “${t.title}” for ${fmtDate(t.date)}`)});
 if(o.repeat&&o.repeat!=='none'&&!o.template){S.taskTemplates.push({id:uid(),...o,checklist:base.checklist.map(c=>c.text),start:o.date,lastMade:o.date})}
 if(!quiet)save();return made}
/* recurring tasks are created when a day is viewed */
function ensureRecurring(d){let n=0;for(const tp of S.taskTemplates||[]){if(d<=tp.start||d<=tp.lastMade&&S.tasks.some(t=>t.template===tp.id&&t.date===d))continue;if(S.tasks.some(t=>t.template===tp.id&&t.date===d))continue;
  const ok=tp.repeat==='daily'||(tp.repeat==='weekdays'&&dow(d)%6!==0)||(tp.repeat==='weekly'&&dow(d)===dow(tp.start));if(!ok||d>addDays(today(),14))continue;createTask({...tp,date:d,template:tp.id,repeat:'none'},true);tp.lastMade=d>tp.lastMade?d:tp.lastMade;n++}if(n)save();return n}
function autoAssignDay(d){let n=0,left=0;for(const t of S.tasks.filter(t=>t.date===d&&!t.assignee&&t.status!=='done')){const pool=[...new Set(shiftsOn(d,{need:t.need,location:t.need?'':t.location,time:t.need?'':t.time}).map(s=>s.member))];const fb=pool.length?pool:[...new Set(shiftsOn(d).map(s=>s.member))];
  if(fb.length){t.assignee=leastBusy(fb,d);n++;notify('task',`${mem(t.assignee).name.split(' ')[0]} was given “${t.title}”`)}else left++}save();return{n,left}}

/* ---------- helpers ---------- */
const myShifts=(from,to)=>S.rota.shifts.filter(s=>s.member===S.me&&s.published&&s.date>=from&&s.date<=to).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
const locName=id=>S.locations.find(l=>l.id===id)?.name||'';
const needName=id=>(S.rota.needs||[]).find(n=>n.id===id)?.name||'';
function shiftLine(s){return`${s.start}–${s.end}${needName(s.need)?` · ${esc(needName(s.need))}`:''}${locName(s.location)?` · ${esc(locName(s.location))}`:''}`}
function punches(mid,d){const ev=[];entriesFor(mid,d,d).sort((a,b)=>a.in-b.in).forEach(e=>{ev.push({t:e.in,k:'in',l:'Clocked in'});(e.breaks||[]).forEach(b=>{const bs=b.start??b.s,be=b.end??b.e;if(!bs)return;ev.push({t:bs,k:'brk',l:`${b.name||'Break'} started`});if(be)ev.push({t:be,k:'brkend',l:`${b.name||'Break'} ended · ${Math.round((be-bs)/6e4)} min`})});if(e.brkStart)ev.push({t:e.brkStart,k:'brk',l:`${e.brkName||'Break'} started`});if(e.out)ev.push({t:e.out,k:'out',l:'Clocked out'})});return ev.sort((a,b)=>a.t-b.t)}
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
function clockButtons(big){const st=status(S.me);const c=big?'sc-btn':'btn';
 if(st==='out')return`<button class="${c} pri" data-act="clockIn">${ic('play',big?22:15)} Clock in</button>`;
 if(st==='in')return`<button class="${c} brk" data-act="startBreak">${ic('coffee',big?22:15)} Start break</button><button class="${c} out" data-act="clockOut">${ic('stop',big?20:13)} Clock out</button>`;
 return`<button class="${c} pri" data-act="endBreak">${ic('play',big?22:15)} End break</button><button class="${c} out" data-act="clockOut">${ic('stop',big?20:13)} Clock out</button>`}
function statusLine(){const st=status(S.me),e=openEntry(S.me);if(st==='out'){const last=S.entries.filter(x=>x.member===S.me&&x.out).sort((a,b)=>b.out-a.out)[0];return last?`Last clocked out ${tsYmd(last.out)===today()?'today':fmtDate(tsYmd(last.out))} at ${tsHM(last.out)}`:'You haven’t clocked in yet'}
 if(st==='break')return`${esc(e.brkName||'Break')} since ${tsHM(e.brkStart)}`;return`Clocked in at ${tsHM(e.in)}`}

 const rows=days.map(d=>{const es=entriesFor(S.me,d,d).sort((a,b)=>a.in-b.in);const sh=myShifts(d,d);const t=dayTotal(S.me,d);const b=es.reduce((a,x)=>a+eBreak(x),0);const isT=d===today();
  return`<div class="s-ts-row ${isT?'today':''} ${!es.length&&!sh.length?'empty':''}"><div class="s-date"><b>${fmtDate(d,{day:'numeric'})}</b><span>${fmtDate(d,{weekday:'short'})}</span></div>

 const acts=self?'':`<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:18px">${m.email?`<button class="btn sm" data-act="peInvite" data-id="${esc(m.id)}">${linked?'Send sign-in link again':'Send sign-in invite'}</button>`:''}${O?.sb&&(linked||O.invited?.has(m.id))?`<button class="btn sm" data-act="uaRemoveLogin" data-id="${esc(m.id)}">Remove sign-in</button>`:''}<button class="btn sm danger" data-act="uaArchive" data-id="${esc(m.id)}">${ic('archive',14)} Remove from team</button></div>`;
 openDrawer(esc(m.name),`${self?'<div class="info-banner">You can’t change your own role, locations or features. Ask another owner or admin.</div>':''}${fld('Role',roleSel)}<div class="nav-sec" style="padding:16px 0 4px;color:var(--ink)">Locations they can use</div>${sites}<div class="nav-sec" style="padding:16px 0 4px;color:var(--ink)">Features</div>${feats}${acts}`,self?`<button class="btn" data-act="closeDrawer">Close</button>`:`<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn pri" data-act="uaSave">Save</button>`)}
const uaRead=()=>{if(!D||D.kind!=='access')return;const a=document.querySelector('#drawer [data-ua-all]');if(a){D.sites=a.checked?[]:[...document.querySelectorAll('#drawer [data-ua-site]:checked')].map(x=>x.value)}document.querySelectorAll('#drawer [data-ua-f]').forEach(x=>{D.features[x.dataset.uaF]=x.checked})};
A.uaOpen=el=>{const m=mem(el.dataset.id);if(!m)return;D={kind:'access',id:m.id,role:m.role,sites:Array.isArray(m.sites)?m.sites.slice():[],features:{...(m.features||{})}};uaDrawer()};
A.uaRole=el=>{uaRead();D.role=el.value;uaDrawer()};
document.addEventListener('change',e=>{const el=e.target;if(!D||D.kind!=='access')return;if(el.matches('[data-ua-site]')&&el.checked){const a=document.querySelector('#drawer [data-ua-all]');if(a)a.checked=false}if(el.matches('[data-ua-all]')&&el.checked)document.querySelectorAll('#drawer [data-ua-site]').forEach(x=>x.checked=false)});
A.uaSave=()=>{uaRead();const m=mem(D.id);if(!m)return;if(m.id===S.me)return closeDrawer();
 if(!['Owner','Admin'].includes(D.role)&&document.querySelector('#drawer [data-ua-all]')&&!document.querySelector('#drawer [data-ua-all]').checked&&!D.sites.length)return toast('Tick at least one location, or All locations','bad');
 if(D.role!==m.role){if(D.role==='Owner'&&me()?.role!=='Owner')return toast('Only an owner can make someone an owner','bad');m.role=D.role}
 if(!['Owner','Admin'].includes(m.role)){if(D.sites.length)m.sites=D.sites.slice();else delete m.sites;const off={};EMP_FEATURES.forEach(([k])=>{if(D.features[k]===false)off[k]=false});if(Object.keys(off).length)m.features=off;else delete m.features}
 save();closeDrawer();render();toast(`Access saved for ${m.name}`)};
A.uaRemoveLogin=el=>{const m=mem(el.dataset.id);const O=window.PE_ONLINE;if(!m||!O?.sb)return;ask(`Remove ${esc(m.name)}’s sign-in? They stay on the team (their timesheets are kept) but can no longer sign in until you invite them again.`,async()=>{const[a,b]=await Promise.all([O.sb.from('pe_people').delete().eq('org_id',O.org).eq('member_id',m.id),O.sb.from('pe_invites').delete().eq('org_id',O.org).eq('member_id',m.id)]);if(a.error||b.error)return toast(O.friendly(a.error||b.error),'bad');O.linked?.delete(m.id);O.invited?.delete(m.id);closeDrawer();render();toast(`${m.name} can no longer sign in`)},'Remove')};
A.uaArchive=el=>{const m=mem(el.dataset.id);if(!m)return;ask(`Remove ${esc(m.name)} from the team? They are archived (their records are kept) and can no longer sign in.`,()=>{m.archived=true;save();closeDrawer();render();toast(`${m.name} removed from the team`)},'Remove')};
try{render()}catch(e){}
</script>
<script src="navy.js?v=1"></script>
</body>
